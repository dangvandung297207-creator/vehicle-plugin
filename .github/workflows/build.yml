name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Build with Gradle
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 \
            | sed -E "s#$(echo $GITHUB_WORKSPACE)/##g" | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wave-motorcycle
          path: |
            build/libs/*.jar
            build/resourcepacks/*.zip
