name: Build Mod
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build with Gradle
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      # On failure only: commit the extracted errors back to the branch so the
      # agent can read them (the sandbox has no Gradle/JDK access).
      - name: Extract errors
        if: failure()
        run: |
          {
            echo "# Build log (errors & context)"
            grep -nE "error:|error\]|FAILURE|BUILD SUCCESS|BUILD FAILED|Caused by|\.java:[0-9]+" build.log | head -150
            echo ""
            echo "## Full javac error blocks:"
            grep -B3 -A6 -E "error:" build.log | head -300
          } > build-errors.txt || true
          cat build-errors.txt | head -80

      - name: Commit build errors
        if: failure()
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add build-errors.txt
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: refresh build-errors.txt (bot)"
            git pull --rebase origin HEAD || true
            git push || true
          fi

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave100-mod-jar
          path: build/libs/*.jar
          if-no-files-found: warn
