# =====================================================================
# VanillaVehicles configuration
# Speeds are meters/second, acceleration/brake/friction are m/s^2,
# steering is degrees per tick at full lock and low speed.
# Sound names are vanilla Bukkit Sound names; unknown names are skipped.
# =====================================================================

settings:
  # Mouse steering (driver look direction) in fallback control mode.
  mouse-steering: true
  max-vehicles-per-player: 3
  max-vehicles-total: 60
  consume-spawner-item: true
  save-interval-minutes: 5
  taxi-rate-per-block: 0.5
  garage-title: "Vehicle Garage"

